[theme]
base = "dark"
primaryColor = "#D4B062"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#151922"
textColor = "#E6E8EC"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.75rem"
borderColor = "#232937"
showWidgetBorder = true
linkColor = "#D4B062"
chartCategoricalColors = ["#D4B062", "#60A5FA", "#34D399", "#F87171", "#A78BFA", "#FBBF24", "#F472B6", "#22D3EE"]

[theme.sidebar]
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#151922"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
